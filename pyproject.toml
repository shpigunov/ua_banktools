[project]
name = "ua-banktools"
version = "0.4.0"
description = ""
authors = [{ name = "Anton Shpigunov", email = "shpigunov@gmail.com" }]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "schwifty<=2026.10.0,>=2026.10.0",
    "httpx>=0.28.1,<1.0.0",
    "pydantic>=2.14.1,<3.0",
    "iso4217>=1.16.20260101,<2.0.0",
]

[dependency-groups]
dev = [
    "mypy>=1.1.1,<2.0.0",
    "ruff>=0.17.3,<0.18.0",
    "pyzmq>=25.1.1,<26.0.0",
    "ipykernel>=6.30.0,<7.0.0",
    "rich>=14.1.0,<15.0.0",
    "ty>=0.0.95,<0.1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ua_banktools"]

[tool.ruff.lint.per-file-ignores]
# Generated by `just stubs` as a faithful copy of upstream's stub; keep its
# typing style so diffs against new iso4217 releases stay readable.
"stubs/**" = ["UP"]

[tool.ty.environment]
# Local stub overrides; see stubs/iso4217/__init__.pyi for why.
extra-paths = ["stubs"]
