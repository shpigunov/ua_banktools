[project]
name = "ua-banktools"
version = "0.1.0"
description = ""
authors = [{ name = "Anton Shpigunov", email = "shpigunov@gmail.com" }]
readme = "README.md"
requires-python = ">=3.10,<4"
dependencies = [
    "schwifty>=2022.9.0,<2023.0.0",
    "requests>=2.28.1,<3.0.0",
    "pydantic>=2.1,<3.0",
]

[dependency-groups]
dev = [
    "black>=22.10.0,<23.0.0",
    "mypy>=1.1.1,<2.0.0",
    "ruff>=0.12.7,<0.13.0",
    "pyzmq>=25.1.1,<26.0.0",
    "ipykernel>=6.30.0,<7.0.0",
    "rich>=14.1.0,<15.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ua_banktools"]
