version: 2
updates:
  # Keeps the SHA-pinned actions current; the version comment is updated too.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    # Let a freshly published release age a week before adopting it, so a
    # compromised version is likely caught and yanked first.
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: uv
    directory: /
    schedule:
      interval: monthly
    # This is a library: pyproject ranges are what users' resolvers see, so
    # they must stay wide. Only touch them when a release falls outside the
    # range (e.g. a new major); otherwise update uv.lock alone. The default
    # strategy raised floors and pinned schwifty to a single version.
    versioning-strategy: increase-if-necessary
    cooldown:
      default-days: 7
    groups:
      dev:
        dependency-type: development
      runtime:
        dependency-type: production
