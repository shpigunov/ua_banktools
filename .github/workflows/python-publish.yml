# Publish to PyPI through Trusted Publishing, with PEP 740 attestations.
#
# PyPI trusts this file, in the `pypi` environment, from this repository --
# not a stored token -- so renaming it or the environment breaks publishing
# until the Trusted Publisher on PyPI is updated to match.
#
# Build and publish are separate jobs so the OIDC credential (id-token: write)
# is never available to the build, which runs the project's own code.

name: Publish to PyPI

on:
  release:
    types: [published]

permissions: {}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          # No cache in a release workflow: a poisoned cache would ship.
          enable-cache: false

      - name: Check the release tag matches the package version
        run: |
          version="$(uv version --short)"
          if [ "$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Release tag $GITHUB_REF_NAME does not match package version $version"
            exit 1
          fi

      - name: Test
        run: uv run --locked python -m unittest discover -s tests -v

      - name: Build
        run: uv build --no-sources

      - name: Upload distributions
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/ua-banktools/${{ github.ref_name }}/
    permissions:
      id-token: write
    steps:
      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: false

      - name: Download distributions
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/

      - name: Generate PEP 740 attestations
        uses: astral-sh/attest-action@39b6ce43875c196a579e31635b11aa2a2036384a # v0.0.7

      - name: Publish
        # `always`: fail rather than fall back to a token if OIDC is unavailable.
        run: uv publish --trusted-publishing always
