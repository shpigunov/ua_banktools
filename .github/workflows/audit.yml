# Security audit: known-vulnerable dependencies in uv.lock, and risky
# GitHub Actions configuration (the publish workflow is what PyPI trusts).
#
# Runs on changes and weekly, since new advisories land without any commit.

name: Security audit

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 6 * * 1" # Mondays, 06:17 UTC
  workflow_dispatch:

permissions: {}

jobs:
  dependencies:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3

      - name: Audit uv.lock against OSV
        # `uv audit` is still a preview feature; the flag only silences the warning.
        run: uv audit --locked --preview-features audit-command

  workflows:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Audit workflows with zizmor
        uses: zizmorcore/zizmor-action@53290badfa369cb0bf7ad16342cb62c2fa47ac7b # v0.8.0
        with:
          version: "1.31.1"
          # Report in the log instead of uploading SARIF, which would need
          # security-events: write.
          advanced-security: false
